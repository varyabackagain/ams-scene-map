<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amsterdam Scene Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one fixed network layout on the left, every lens recolours it; side panel explains */
  --bg:#f1f2f4; --surface:#ffffff; --ink:#15161a; --muted:#666b77; --line:#cdd0d7; --accent:#d4157a;
  --closing:#d9730d; --touring:#2b78d0; --closed:#9a9ea8;
  --our:#1c9a52; --warm:#d39a00; --cold:#7d90b2;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111216; --surface:#191a20; --ink:#eceef2; --muted:#8f94a0; --line:#33363e; --accent:#ff4c9c;
    --closing:#f08a2a; --touring:#5a9cf0; --closed:#6c707a; --our:#36c477; --warm:#f0b52a; --cold:#8ea2c6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#191a20; --ink:#eceef2; --muted:#8f94a0; --line:#33363e; --accent:#ff4c9c;
  --closing:#f08a2a; --touring:#5a9cf0; --closed:#6c707a; --our:#36c477; --warm:#f0b52a; --cold:#8ea2c6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
h1{font:700 22px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px}
.upd{color:var(--accent);font-weight:600}
.bubbles{display:flex;gap:6px;align-items:center;margin:6px 0 4px;flex-wrap:wrap}
.bubbles .bl{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubbles button{font:600 12.5px var(--display);letter-spacing:.04em;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:3px 10px;border-radius:999px;cursor:pointer}
.bubbles button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button,.chip-btn{font:600 13px var(--display);letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#svg{flex:1;width:100%;min-height:380px;display:block;cursor:grab}
#svg:active{cursor:grabbing}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid transparent}
.toolbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto}
aside{width:360px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px 18px 28px}
aside h2{font:700 18px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
aside h3{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
aside p{margin:0 0 8px;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.chip{font:500 11px var(--body);padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.s-Closing{color:var(--closing);border-color:var(--closing)}
.chip.s-Closed{color:var(--closed);border-color:var(--closed)}
.chip.s-Touring{color:var(--touring);border-color:var(--touring)}
.chip.s-Live{color:var(--our);border-color:var(--our)}
.chip.r-our{background:var(--our);border-color:var(--our);color:#fff}
.chip.r-warm{background:var(--warm);border-color:var(--warm);color:#111}
.chip.r-cold{color:var(--cold);border-color:var(--cold)}
.find{border-top:1px solid var(--line);padding:10px 0}
.find b{font-family:var(--display);font-size:15px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;padding:0;text-align:left;justify-self:start;color:var(--ink);font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.lnk:hover{text-decoration-color:var(--accent)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:3px 0;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.bar{height:6px;background:var(--accent);border-radius:3px;opacity:.85}
.barrow{display:grid;grid-template-columns:1fr 70px 22px;gap:8px;align-items:center;padding:3px 0}
.barrow.pick .lnk{color:var(--accent);font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.cats button{font:500 11.5px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btn{font:500 12px var(--body);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:4px 10px;border-radius:4px;cursor:pointer}
.big{font:600 34px/1 var(--mono);letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.ext a{color:var(--accent)}
#matrixWrap{display:none;flex:1;overflow:auto;padding:16px 20px}
table{border-collapse:collapse;font-size:12.5px;min-width:900px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font:600 11.5px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;background:var(--bg)}
td.empty{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--line) 45%,transparent) 5px 6px)}
td .t{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin:1px 2px 1px 0;white-space:nowrap}
tr.sep td{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--ink);padding-top:16px}
.foot{color:var(--muted);font-size:12px;margin-top:10px;max-width:80ch}
svg text{font-family:var(--body);pointer-events:none}
.lbl-big{font:600 12px var(--display);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lbl-sm{font-size:9.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:2.5px}
.lbl-bridge{font-size:10.5px;font-weight:600;fill:var(--ink)}
.lbl-st{font:500 9px var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:2.5px}
.node{cursor:pointer}
@media (max-width:820px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  #svg{min-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.node,.lk,.ov{transition:opacity .2s}
.find-box{position:absolute;top:12px;left:16px;z-index:2}
.find-box input{font:500 13px var(--body);width:210px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.ov-n{font:600 10.5px var(--mono);fill:var(--accent);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Amsterdam scene map</h1>
    <div class="bubbles" id="bubbles"></div>
    <div class="sub" id="sub"></div>
  </div>
  <nav aria-label="Lens">
    <button data-lens="network">Network</button>
    <button data-lens="overlap">Overlap</button>
    <button data-lens="tools">Tools</button>
    <button data-lens="reach">Reach</button>
    <button data-lens="matrix">Tools matrix</button>
  </nav>
</header>
<main>
  <div id="stage">
    <div class="find-box"><input id="q" list="names" placeholder="Find on map…" aria-label="Find on map" autocomplete="off"><datalist id="names"></datalist></div>
    <svg id="svg" role="img" aria-label="Network map of one bubble of the Amsterdam scene"></svg>
    <div id="matrixWrap"></div>
    <div class="toolbar"><div class="legend" id="legend"></div>
      <label><input type="checkbox" id="agToggle"> Show agencies &amp; labels</label></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const RAW = /*DATA*/null;
let BUB = RAW.bubbles[0];
try { const s = localStorage.getItem('scene-bubble'); if (RAW.bubbles.includes(s)) BUB = s; } catch(e) {}
const keep = new Set(RAW.nodes.filter(n => n.bubbles.includes(BUB)).map(n => n.id));
const D = { ...RAW, nodes: RAW.nodes.filter(n => keep.has(n.id)), links: RAW.links.filter(l => keep.has(l.s) && keep.has(l.t)) };
document.getElementById('bubbles').innerHTML = '<span class="bl">Bubble</span>' + RAW.bubbles.map(b => `<button data-bubble="${b}" aria-pressed="${b === BUB}">${b}</button>`).join('') ;
document.getElementById('bubbles').addEventListener('click', e => { const b = e.target.closest('[data-bubble]'); if (!b || b.dataset.bubble === BUB) return; try { localStorage.setItem('scene-bubble', b.dataset.bubble); } catch(err) {} location.reload(); });
const byId = new Map(D.nodes.map(n => [n.id, n]));
const isPromo = n => n.type === 'Collective' || n.type === 'Festival';
const isCore = n => ['Venue','Collective','Festival','Artist'].includes(n.type);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- graph ----------
const adj = new Map(D.nodes.map(n => [n.id, new Set()]));
D.links.forEach(l => { if (l.k === 'plays' || l.k === 'works') { adj.get(l.s).add(l.t); adj.get(l.t).add(l.s); } });
const nb = (id, pred) => [...adj.get(id)].map(x => byId.get(x)).filter(pred);
D.nodes.forEach(n => { n.nPromo = n.type === 'Artist' ? nb(n.id, isPromo).length : 0; });
const signedTo = id => D.links.filter(l => l.k === 'signed' && l.s === id).map(l => byId.get(l.t));
const roster = id => D.links.filter(l => l.k === 'signed' && l.t === id).map(l => byId.get(l.s));
const agentsOf = id => D.links.filter(l => l.k === 'agent' && l.t === id).map(l => byId.get(l.s));
const orgsOf = id => D.links.filter(l => l.k === 'agent' && l.s === id).map(l => byId.get(l.t));
const shared = (a, b) => nb(a, n => n.type === 'Artist').filter(x => adj.get(b).has(x.id));
const core = D.nodes.filter(isCore);
const promos = D.nodes.filter(isPromo), venues = D.nodes.filter(n => n.type === 'Venue'), artists = D.nodes.filter(n => n.type === 'Artist');

document.getElementById('sub').innerHTML =
  `${BUB} · updated from Notion ${D.snapshot}${D.updateUrl ? ` · <a class="upd" href="${D.updateUrl}" target="_blank" rel="noopener">Update the map</a>` : ''} · <span class="num">${core.length}</span> on the map: ${venues.length} venues, ${promos.length} promo groups, ${artists.length} artists · plus ${D.nodes.filter(n=>n.type==='Agency').length} agencies & labels and ${D.nodes.filter(n=>n.type==='Key agent').length} key agents`;

// ---------- layout (computed once, same for every lens) ----------
function R(d){ const a = d.also.length;
  switch(d.type){ case 'Venue': return 11 + a*2; case 'Collective': case 'Festival': return 10 + a*2.2;
    case 'Artist': return 4 + (d.nPromo >= 3 ? 3 : 0) + a*0.8; case 'Agency': return 6; default: return 4.5; } }
const linked = core.filter(n => adj.get(n.id).size > 0);
const floaters = core.filter(n => adj.get(n.id).size === 0);
const ids = new Set(linked.map(n => n.id));
const simLinks = D.links.filter(l => (l.k==='plays'||l.k==='works') && ids.has(l.s) && ids.has(l.t)).map(l => ({source:l.s, target:l.t, k:l.k}));
const sim = d3.forceSimulation(linked)
  .force('link', d3.forceLink(simLinks).id(d => d.id)
    .distance(l => l.k==='works' ? 100 : (l.source.type==='Artist'||l.target.type==='Artist') ? 58 : 75)
    .strength(l => l.k==='works' ? .3 : (l.source.type==='Artist'||l.target.type==='Artist') ? .3 : 1))
  .force('charge', d3.forceManyBody().strength(d => d.type==='Artist' ? -120 : -650))
  .force('collide', d3.forceCollide(d => R(d) + (d.type==='Artist' ? 18 : 40)).iterations(2))
  .force('x', d3.forceX(0).strength(.045)).force('y', d3.forceY(0).strength(.07)).stop();
for (let i = 0; i < 600; i++) sim.tick();
const mean = arr => [d3.mean(arr, d => d.x), d3.mean(arr, d => d.y)];
D.nodes.filter(n => n.type === 'Agency').forEach((n, i) => {
  const r = roster(n.id).filter(x => ids.has(x.id)); if (!r.length) { n.hidden = true; return; }
  const [mx, my] = mean(r); const len = Math.hypot(mx, my) || 1; n.x = mx + mx/len*60; n.y = my + my/len*60 + (i%2?12:-12);
});
D.nodes.filter(n => n.type === 'Key agent').forEach((n, i) => {
  const o = orgsOf(n.id).filter(x => x.x !== undefined); if (!o.length) { n.hidden = true; return; }
  const [mx, my] = mean(o); const a = i * 2.4; n.x = mx + Math.cos(a)*34; n.y = my + Math.sin(a)*34;
});
{ const maxY = d3.max(linked, d => d.y), minX = d3.min(linked, d => d.x);
  floaters.forEach((n, i) => { n.x = minX + 40 + i*150; n.y = maxY + 110; }); }

// ---------- draw ----------
const svg = d3.select('#svg'); const root = svg.append('g');
const gL = root.append('g'), gN = root.append('g');
const placed = D.nodes.filter(n => n.x !== undefined && !n.hidden);
if (floaters.length) root.insert('text', ':first-child').attr('class','lbl-sm')
  .attr('x', d3.min(floaters, d => d.x) - 12).attr('y', floaters[0].y - 26).text('Not linked to anyone in the base yet');
const lk = gL.selectAll('line').data(D.links.filter(l => byId.get(l.s).x !== undefined && byId.get(l.t).x !== undefined && !byId.get(l.s).hidden && !byId.get(l.t).hidden))
  .join('line').attr('class', d => 'lk k-' + d.k)
  .attr('x1', d => byId.get(d.s).x).attr('y1', d => byId.get(d.s).y).attr('x2', d => byId.get(d.t).x).attr('y2', d => byId.get(d.t).y);
const nd = gN.selectAll('g').data(placed, d => d.id).join('g').attr('class','node').attr('tabindex', 0)
  .attr('transform', d => `translate(${d.x},${d.y})`);
nd.append('title').text(d => d.name);
nd.each(function(d){
  const g = d3.select(this), r = R(d);
  if (d.status === 'Closing') g.append('circle').attr('class','st-ring').attr('r', r + 5).attr('fill','none').attr('stroke-width', 2.5).attr('stroke', 'var(--closing)');
  if (d.status === 'Touring') g.append('circle').attr('class','st-ring').attr('r', r + 5).attr('fill','none').attr('stroke-width', 2).attr('stroke-dasharray','3 3').attr('stroke', 'var(--touring)');
  g.append('circle').attr('class','seed-ring').attr('r', r + 9).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width', 3).attr('opacity', 0);
  let s;
  if (d.type === 'Venue') s = g.append('rect').attr('x', -r).attr('y', -r).attr('width', 2*r).attr('height', 2*r).attr('rx', 2);
  else if (d.type === 'Agency') s = g.append('rect').attr('x', -r).attr('y', -r).attr('width', 2*r).attr('height', 2*r).attr('transform','rotate(45)');
  else if (d.type === 'Key agent') s = g.append('path').attr('d', d3.symbol(d3.symbolTriangle, 70)());
  else s = g.append('circle').attr('r', r);
  s.attr('class','shape').attr('stroke-width', d.type === 'Festival' ? 3 : 1.5);
  if (d.status === 'Closed') s.attr('stroke-dasharray', '3 2');
  const big = d.type === 'Venue' || isPromo(d);
  const t = g.append('text').attr('text-anchor','middle').attr('y', r + (big ? 15 : 11))
    .attr('class', big ? 'lbl-big' : (d.type==='Artist' && d.nPromo >= 3 ? 'lbl-sm lbl-bridge' : 'lbl-sm')).text(d.name);
  if (d.type === 'Key agent' || d.type === 'Agency') t.style('font-size', '8.5px');
  if (d.status && d.status !== 'Live') g.append('text').attr('class','lbl-st').attr('text-anchor','middle').attr('y', r + 26)
    .attr('fill', `var(--${d.status.toLowerCase()})`).text(d.status === 'Closing' ? 'closing 2027' : d.status.toLowerCase());
});
const gO = root.insert('g', () => gN.node());
const ovData = (() => { const out = []; for (let i = 0; i < promos.length; i++) for (let j = i+1; j < promos.length; j++){
  const a = promos[i], b = promos[j]; if (a.x === undefined || b.x === undefined) continue;
  const s = shared(a.id, b.id); if (s.length) out.push([a, b, s]); } return out; })();
const ov = gO.selectAll('g').data(ovData).join('g').attr('class','ov').style('display','none');
ov.append('line').attr('x1', d => d[0].x).attr('y1', d => d[0].y).attr('x2', d => d[1].x).attr('y2', d => d[1].y)
  .attr('stroke','var(--accent)').attr('stroke-linecap','round').attr('stroke-width', d => 1.2 + (d[2].length - 1) * 1.8);
ov.append('text').attr('class','ov-n').attr('text-anchor','middle').attr('x', d => (d[0].x + d[1].x)/2).attr('y', d => (d[0].y + d[1].y)/2 + 4).text(d => d[2].length);
ov.append('title').text(d => `${d[0].name} × ${d[1].name}: ${d[2].map(x => x.name).join(', ')}`);
const zoom = d3.zoom().scaleExtent([.3, 4]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);
function fit(){
  const vis = placed.filter(n => n.type !== 'Key agent' && n.type !== 'Agency');
  const [x0, x1] = d3.extent(vis, d => d.x), [y0, y1] = d3.extent(vis, d => d.y);
  const w = svg.node().clientWidth, h = svg.node().clientHeight, pad = 60;
  const k = Math.min(w / (x1 - x0 + pad*2), h / (y1 - y0 + pad*2), 1.6);
  svg.call(zoom.transform, d3.zoomIdentity.translate(w/2 - k*(x0+x1)/2, h/2 - k*(y0+y1)/2).scale(k));
}

// ---------- state ----------
const S = { lens: 'network', sel: null, cat: 'Ticketing', tool: null, seeds: new Set(), ag: false };
const ourSeeds = () => core.filter(n => n.rel === 'Our contact').map(n => n.id);
S.seeds = new Set(ourSeeds());

function reach(seeds){
  const d = new Map(); [...seeds].forEach(s => d.set(s, 0));
  let fr = [...seeds];
  for (let step = 1; step <= 2; step++){ const nx = [];
    fr.forEach(id => adj.get(id).forEach(x => { if (!d.has(x)) { d.set(x, step); nx.push(x); } })); fr = nx; }
  return d;
}
const cover = (d, maxStep, pred = () => true) => core.filter(n => pred(n) && d.has(n.id) && d.get(n.id) <= maxStep).length;

// tool ranking within a category, over promo groups + venues + artists
function ranking(cat){
  const c = new Map(); D.nodes.forEach(n => n.tools.filter(t => t.cat === cat).forEach(t => c.set(t.name, (c.get(t.name)||0) + 1)));
  return [...c].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const PAL = ['#d4157a','#2b78d0','#1c9a52','#d39a00','#7b4fd6','#0f9e9e'];

// ---------- paint ----------
function paint(){
  const L = S.lens, sel = S.sel ? byId.get(S.sel) : null;
  const focus = new Set();
  if (sel){ focus.add(sel.id); adj.get(sel.id).forEach(x => focus.add(x));
    signedTo(sel.id).forEach(x => focus.add(x.id)); roster(sel.id).forEach(x => focus.add(x.id));
    agentsOf(sel.id).forEach(x => focus.add(x.id)); orgsOf(sel.id).forEach(x => focus.add(x.id)); }
  const rk = ranking(S.cat), toolCol = new Map(rk.slice(0, 6).map(([t], i) => [t, PAL[i]]));
  const rd = L === 'reach' ? reach(S.seeds) : null;
  const shown = n => n.id === S.sel || (L === 'overlap' ? (isPromo(n) || n.type === 'Venue') : !(n.type === 'Agency' && !S.ag) && !(n.type === 'Key agent' && L !== 'reach'));
  const ovFocus = new Set(); if (sel){ ovFocus.add(sel.id); nb(sel.id, n => n.type === 'Venue' || isPromo(n)).forEach(x => ovFocus.add(x.id)); promos.forEach(p => { if (shared(sel.id, p.id).length) ovFocus.add(p.id); }); }
  nd.style('display', d => shown(d) ? null : 'none');
  lk.style('display', l => (shown(byId.get(l.s)) && shown(byId.get(l.t)) && !(l.k === 'agent' && L !== 'reach' && l.s !== S.sel)) ? null : 'none');
  ov.style('display', L === 'overlap' ? null : 'none').style('opacity', d => !sel ? .8 : (d[0].id === sel.id || d[1].id === sel.id) ? 1 : .07);

  nd.each(function(d){
    const g = d3.select(this), s = g.select('.shape');
    let fill, stroke, op = 1, dash = d.status === 'Closed' ? '3 2' : null;
    if (L === 'network'){
      if (d.type === 'Venue'){ fill = 'var(--ink)'; stroke = 'var(--ink)'; }
      else if (isPromo(d)){ fill = d.type === 'Festival' ? 'var(--surface)' : 'var(--accent)'; stroke = 'var(--accent)'; }
      else if (d.type === 'Artist'){ fill = d.nPromo >= 3 ? 'var(--accent)' : d.nPromo === 2 ? 'color-mix(in srgb, var(--accent) 45%, var(--surface))' : 'var(--muted)'; stroke = 'var(--surface)'; }
      else { fill = 'var(--surface)'; stroke = 'var(--muted)'; }
      if (sel && !focus.has(d.id)) op = .14;
    } else if (L === 'overlap'){
      fill = d.type === 'Venue' ? 'var(--ink)' : d.type === 'Festival' ? 'var(--surface)' : 'var(--accent)'; stroke = d.type === 'Venue' ? 'var(--ink)' : 'var(--accent)';
      if (sel && !ovFocus.has(d.id)) op = .15;
    } else if (L === 'tools'){
      const mine = d.tools.filter(t => t.cat === S.cat);
      if (mine.length){ fill = toolCol.get(mine[0].name) || 'var(--muted)'; stroke = mine.length > 1 ? 'var(--ink)' : fill; if (mine.length > 1) dash = '2 2'; }
      else { fill = 'var(--surface)'; stroke = 'var(--line)'; if (d.type === 'Artist' || d.type === 'Agency') op = .35; }
      if (S.tool) op = d.tools.some(t => t.name === S.tool) ? 1 : .12;
      if (sel && !focus.has(d.id)) op = Math.min(op, .14);
    } else if (L === 'reach'){
      fill = d.rel === 'Our contact' ? 'var(--our)' : d.rel === 'Warm lead' ? 'var(--warm)' : d.rel === 'Cold' ? 'var(--cold)' : 'var(--surface)';
      stroke = d.rel ? fill : 'var(--muted)';
      const st = rd.get(d.id);
      op = d.type === 'Key agent' ? (d.rel ? .95 : .5) : st === undefined ? .13 : st === 2 ? .5 : 1;
    }
    if (d.status === 'Closed' && L !== 'reach') op = Math.min(op, .45);
    s.attr('fill', fill).attr('stroke', stroke).attr('stroke-dasharray', dash);
    g.style('opacity', op);
    g.select('.seed-ring').attr('opacity', L === 'reach' && S.seeds.has(d.id) ? 1 : (sel && sel.id === d.id && L !== 'reach') ? .9 : 0);
  });
  lk.attr('stroke', l => l.k === 'works' ? (L === 'overlap' ? 'var(--ink)' : 'var(--accent)') : 'var(--line)')
    .attr('stroke-width', l => l.k === 'works' ? 2.2 : 1)
    .attr('stroke-dasharray', l => l.k === 'works' ? '5 3' : l.k === 'signed' || l.k === 'agent' ? '1 3' : null)
    .style('opacity', l => {
      if (L === 'overlap') return sel ? ((l.s === sel.id || l.t === sel.id) ? .7 : .04) : (l.k === 'works' ? .55 : .2);
      if (L === 'network' || L === 'tools') return sel ? ((l.s === sel.id || l.t === sel.id) ? 1 : .06) : (L === 'tools' ? .35 : .8);
      if (L === 'reach'){ const a = rd.get(l.s), b = rd.get(l.t); return (a !== undefined && b !== undefined && Math.min(a,b) === 0) ? .9 : (a !== undefined && b !== undefined) ? .35 : .06; }
    });
  legend(toolCol);
}

// ---------- legend ----------
function legend(toolCol){
  const el = document.getElementById('legend'), sw = (c, b, sq) => `<span class="sw" style="background:${c};border-color:${b||c};${sq?'border-radius:2px':''}"></span>`;
  const status = `<span class="lg">${sw('transparent','var(--closing)')}closing</span><span class="lg">${sw('transparent','var(--touring)')}touring</span><span class="lg">${sw('transparent','var(--closed)')}closed (faded)</span>`;
  if (S.lens === 'network') el.innerHTML = `<span class="lg">${sw('var(--ink)',null,1)}venue</span><span class="lg">${sw('var(--accent)')}collective</span><span class="lg">${sw('var(--surface)','var(--accent)')}festival</span><span class="lg">${sw('var(--accent)')}artist in 3+ groups</span><span class="lg">${sw('color-mix(in srgb, var(--accent) 45%, var(--surface))')}2 groups</span><span class="lg">${sw('var(--muted)')}1 group</span><span class="lg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/></svg>works with</span>` + status + `<span class="lg">size = extra roles</span>`;
  else if (S.lens === 'overlap') el.innerHTML = `<span class="lg">${sw('var(--accent)')}promo group</span><span class="lg">${sw('var(--ink)',null,1)}venue</span><span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--accent)" stroke-width="4"/></svg>shared artists: thicker = more, number = how many (hover a line for names)</span><span class="lg"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/></svg>works with</span>` + status;
  else if (S.lens === 'tools') el.innerHTML = [...toolCol].map(([t, c]) => `<span class="lg">${sw(c)}${esc(t)}</span>`).join('') + `<span class="lg">${sw('var(--muted)')}other</span><span class="lg">${sw('var(--surface)','var(--line)')}none found</span><span class="lg">${sw('transparent','var(--ink)')}dotted outline = 2+ tools</span>`;
  else if (S.lens === 'reach') el.innerHTML = `<span class="lg">${sw('var(--our)')}our contact</span><span class="lg">${sw('var(--warm)')}warm lead</span><span class="lg">${sw('var(--cold)')}cold</span><span class="lg">${sw('var(--surface)','var(--muted)')}not assessed</span><span class="lg">${sw('transparent','var(--accent)')}first merchant (click to toggle)</span><span class="lg">faded = 2 steps away, very faded = out of reach</span><span class="lg"><svg width="12" height="10"><path d="M6 1 L11 9 L1 9 Z" fill="var(--muted)"/></svg>key agent</span>`;
}

// ---------- panel ----------
const P = document.getElementById('panel');
const nm = n => `<button class="lnk" data-go="${n.id}">${esc(n.name)}</button>`;
const stChip = n => n.status ? `<span class="chip s-${n.status}">${n.status === 'Closing' ? 'closing 2027' : n.status.toLowerCase()}</span>` : '';
const relChip = n => n.rel ? `<span class="chip r-${n.rel === 'Our contact' ? 'our' : n.rel === 'Warm lead' ? 'warm' : 'cold'}">${n.rel.toLowerCase()}</span>` : '';
function pairs(){
  const out = []; for (let i = 0; i < promos.length; i++) for (let j = i+1; j < promos.length; j++){
    const s = shared(promos[i].id, promos[j].id); if (s.length) out.push([promos[i], promos[j], s]); }
  return out.sort((a, b) => b[2].length - a[2].length);
}

function detail(n){
  const sect = (t, arr, extra) => arr.length ? `<h3>${t}</h3><p>${arr.map(x => nm(x) + (extra ? extra(x) : '')).join(', ')}</p>` : '';
  let h = `<button class="lnk" data-clear>Close</button><h2 style="margin-top:10px">${esc(n.name)}</h2>
   <div class="chips"><span class="chip">${n.type}</span>${stChip(n)}${relChip(n)}${n.also.map(a => `<span class="chip">+ ${esc(a)}</span>`).join('')}</div>
   ${n.about ? `<p>${esc(n.about)}</p>` : ''}${n.notes ? `<p class="sub">${esc(n.notes)}</p>` : ''}`;
  if (n.type === 'Venue') h += sect('Hosts', nb(n.id, isPromo)) + sect('Artists linked directly', nb(n.id, x => x.type === 'Artist'));
  if (isPromo(n)){
    h += sect('Plays at', nb(n.id, x => x.type === 'Venue'), v => v.status !== 'Live' ? ` <span class="chip s-${v.status}">${v.status.toLowerCase()}</span>` : '');
    h += sect('Works with', nb(n.id, isPromo));
    const sh = promos.filter(p => p.id !== n.id).map(p => [p, shared(n.id, p.id)]).filter(x => x[1].length).sort((a, b) => b[1].length - a[1].length);
    if (sh.length) h += `<h3>Shares artists with</h3><ul class="plain">${sh.map(([p, s]) => `<li><span>${nm(p)} <span class="sub">${s.map(x => esc(x.name)).join(', ')}</span></span><span class="num">${s.length}</span></li>`).join('')}</ul>`;
    h += sect('Artists', nb(n.id, x => x.type === 'Artist'));
  }
  if (n.type === 'Artist') h += sect('Plays for', nb(n.id, x => isPromo(x) || x.type === 'Venue')) + sect('Booked by', signedTo(n.id));
  if (n.type === 'Agency') h += sect('Roster here', roster(n.id));
  if (n.type === 'Key agent') h += sect('Part of', orgsOf(n.id));
  h += sect('Key agents', agentsOf(n.id));
  if (n.tools.length){
    const g = d3.group(n.tools, t => t.cat);
    h += `<h3>Tools</h3><div class="kv">${D.toolCats.filter(c => g.has(c)).map(c => `<span class="sub">${esc(c)}</span><span>${g.get(c).map(t => esc(t.name)).join(', ')}</span>`).join('')}</div>`;
    const miss = ['Ticketing','Merch / shop','Releases','Newsletter / community'].filter(c => !g.has(c));
    if (miss.length && n.type !== 'Artist') h += `<p class="sub" style="margin-top:6px">Nothing found for: ${miss.join(', ')}</p>`;
  } else if (n.type !== 'Key agent') h += `<h3>Tools</h3><p class="sub">None recorded yet.</p>`;
  h += `<p class="ext" style="margin-top:16px"><a href="${n.notion}" target="_blank" rel="noopener">Open in Notion</a>${n.link ? ` · <a href="${esc(n.link)}" target="_blank" rel="noopener">Link</a>` : ''}</p>`;
  return h;
}

function toolsPanel(){
  const rk = ranking(S.cat), max = rk.length ? rk[0][1] : 1;
  const missing = promos.concat(venues).filter(n => !n.tools.some(t => t.cat === S.cat));
  return `<h2>Tools: who uses what</h2><p class="sub">Pick a function. Nodes take the colour of the tool they use for it. Click a tool to see only its users.</p>
   <div class="cats">${D.toolCats.map(c => `<button data-cat="${esc(c)}" aria-pressed="${c === S.cat}">${esc(c)}</button>`).join('')}</div>
   <h3>${esc(S.cat)} · users in the bubble</h3>
   ${rk.length ? rk.map(([t, c]) => `<div class="barrow ${S.tool === t ? 'pick' : ''}"><button class="lnk" data-tool="${esc(t)}">${esc(t)}</button><div class="bar" style="width:${c/max*100}%"></div><span class="num">${c}</span></div>`).join('') : '<p class="sub">Nothing recorded.</p>'}
   ${S.tool ? `<div class="btnrow"><button class="btn" data-tool="">Show all tools</button></div>` : ''}
   <h3>No ${esc(S.cat.toLowerCase())} found (${missing.length} of ${promos.length + venues.length})</h3><p>${missing.map(nm).join(', ') || '<span class="sub">Everyone has something.</span>'}</p>
   ${S.sel ? '' : ''}`;
}

function reachPanel(){
  const rd = reach(S.seeds), seeds = [...S.seeds].map(id => byId.get(id));
  const row = (lab, pred, tot) => `<li><span>${lab}</span><span class="num">${cover(rd, 1, pred)} / ${cover(rd, 2, pred)} of ${tot}</span></li>`;
  const cands = core.filter(n => (isPromo(n) || n.type === 'Venue') && !S.seeds.has(n.id) && n.status !== 'Closed').map(n => {
    const s2 = new Set(S.seeds); s2.add(n.id); return [n, cover(reach(s2), 1) - cover(rd, 1)]; }).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const pct = x => Math.round(x / core.length * 100);
  return `<h2>Reach: pick first merchants</h2><p class="sub">Click nodes on the map to add or remove them. Reach counts direct links in the base (played for, plays at, works with). It shows who is one handshake away, not who would sign up.</p>
   <div style="display:flex;gap:24px;margin:10px 0"><div><div class="big">${pct(cover(rd,1))}%</div><div class="sub">1 step · <span class="num">${cover(rd,1)}</span> of ${core.length}</div></div><div><div class="big" style="color:var(--muted)">${pct(cover(rd,2))}%</div><div class="sub">2 steps · <span class="num">${cover(rd,2)}</span></div></div></div>
   <ul class="plain">${row('Venues', n => n.type === 'Venue', venues.length)}${row('Promo groups', isPromo, promos.length)}${row('Artists', n => n.type === 'Artist', artists.length)}</ul>
   <h3>Selected (${seeds.length})</h3><p>${seeds.map(n => `${nm(n)} ${stChip(n)}`).join(', ') || '<span class="sub">None. Click nodes on the map.</span>'}</p>
   <div class="btnrow"><button class="btn" data-seeds="our">Start from our contacts</button><button class="btn" data-seeds="clear">Clear</button></div>
   ${cands.length ? `<h3>Adds the most in one step</h3><ul class="plain">${cands.map(([n, g]) => `<li><span><button class="lnk" data-add="${n.id}">+ ${esc(n.name)}</button> ${stChip(n)}${relChip(n)}</span><span class="num">+${g}</span></li>`).join('')}</ul>` : ''}`;
}

function matrix(){
  const rows = [['Promo groups', promos], ['Venues', venues]];
  const cats = D.toolCats;
  const cov = c => promos.concat(venues).filter(n => n.tools.some(t => t.cat === c)).length;
  let h = `<table><thead><tr><th>Player</th>${cats.map(c => `<th>${esc(c)}<br><span class="num" style="font-weight:400">${cov(c)} / ${promos.length + venues.length}</span></th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(([lab, arr]) => {
    h += `<tr class="sep"><td colspan="${cats.length + 1}">${lab}</td></tr>`;
    [...arr].sort((a, b) => a.name.localeCompare(b.name)).forEach(n => {
      h += `<tr><td><button class="lnk" data-go="${n.id}" data-lens-go="network">${esc(n.name)}</button><br>${stChip(n)}</td>` + cats.map(c => {
        const t = n.tools.filter(x => x.cat === c); return t.length ? `<td>${t.map(x => `<span class="t">${esc(x.name)}</span>`).join('')}</td>` : '<td class="empty"></td>'; }).join('') + '</tr>';
    });
  });
  h += `</tbody></table><p class="foot">Hatched cells: nothing found in public sources (sites, Instagram, RA, Linktree). That is either a gap the platform can fill or a tool we haven't spotted yet. Artists' tools (mostly Bandcamp) are in each artist's panel. Snapshot ${D.snapshot}.</p>`;
  return h;
}

function render(){
  const L = S.lens;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lens === L));
  const isMap = L !== 'matrix';
  document.getElementById('svg').style.display = isMap ? '' : 'none';
  document.querySelector('.toolbar').style.display = isMap ? '' : 'none';
  const mw = document.getElementById('matrixWrap'); mw.style.display = isMap ? 'none' : 'block';
  document.querySelector('.find-box').style.display = isMap ? '' : 'none';
  P.style.display = isMap && (L === 'reach' || L === 'tools' || S.sel) ? '' : 'none';
  setHash();
  if (!isMap){ mw.innerHTML = `<p style="max-width:80ch;margin:0 0 12px">Every venue and promo group against every function the platform could cover. Read across a row for one player's stack, down a column for how a function is covered across the bubble. Click a name to open it on the map.</p>` + matrix(); return; }
  if (L === 'reach') P.innerHTML = reachPanel();
  else if (S.sel) P.innerHTML = detail(byId.get(S.sel));
  else if (L === 'tools') P.innerHTML = toolsPanel();
  paint();
}

// ---------- events ----------
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function setHash(){
  let h = S.lens === 'tools' ? 'tools-' + slug(S.cat) : S.lens;
  if (S.sel && ['network','overlap','tools'].includes(S.lens)) h += '--' + S.sel;
  if (location.hash.slice(1) !== h) { try { history.replaceState(null, '', '#' + h); } catch(e) {} }
}
function go(lens){ S.lens = lens; if (lens === 'reach' || lens === 'matrix') S.sel = null;
  if (lens === 'overlap' && S.sel && !(isPromo(byId.get(S.sel)) || byId.get(S.sel).type === 'Venue')) S.sel = null; render(); }
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.lens)));
nd.on('click', (e, d) => { e.stopPropagation();
  if (S.lens === 'reach'){ if (!isCore(d)) return; S.seeds.has(d.id) ? S.seeds.delete(d.id) : S.seeds.add(d.id); }
  else S.sel = S.sel === d.id ? null : d.id; render(); })
  .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.dispatchEvent(new MouseEvent('click')); } });
svg.on('click', () => { if (S.sel && S.lens !== 'reach'){ S.sel = null; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.lensGo && !t.dataset.go){ go(t.dataset.lensGo); return; }
  if (t.dataset.go){ if (t.dataset.lensGo) S.lens = t.dataset.lensGo; if (S.lens === 'reach') S.lens = 'network'; S.sel = t.dataset.go; render(); zoomTo(byId.get(S.sel)); return; }
  if ('clear' in t.dataset){ S.sel = null; render(); return; }
  if (t.dataset.cat){ S.cat = t.dataset.cat; S.tool = null; render(); return; }
  if ('tool' in t.dataset){ S.tool = t.dataset.tool && S.tool !== t.dataset.tool ? t.dataset.tool : null; render(); return; }
  if (t.dataset.seeds){ S.seeds = t.dataset.seeds === 'our' ? new Set(ourSeeds()) : new Set(); render(); return; }
  if (t.dataset.add){ S.seeds.add(t.dataset.add); render(); return; }
});
document.getElementById('agToggle').addEventListener('change', e => { S.ag = e.target.checked; paint(); });
function fromHash(){
  const [a = '', id] = decodeURIComponent(location.hash.slice(1)).split('--');
  if (a.startsWith('tools-')){ S.lens = 'tools'; const c = D.toolCats.find(c => slug(c) === a.slice(6)); if (c) S.cat = c; }
  else if (['network','overlap','tools','reach','matrix'].includes(a)) S.lens = a;
  S.sel = id && byId.has(id) ? id : null;
}
// ---------- find on map ----------
function zoomTo(n){ if (!n || n.x === undefined) return;
  const w = svg.node().clientWidth, h = svg.node().clientHeight, k = 1.5;
  const tr = d3.zoomIdentity.translate(w/2 - k*n.x, h/2 - k*n.y).scale(k);
  matchMedia('(prefers-reduced-motion: reduce)').matches ? svg.call(zoom.transform, tr) : svg.transition().duration(500).call(zoom.transform, tr); }
document.getElementById('names').innerHTML = placed.map(n => `<option value="${esc(n.name)}"></option>`).join('');
function findNode(q){ q = q.trim().toLowerCase(); if (!q) return;
  const n = placed.find(x => x.name.toLowerCase() === q) || placed.find(x => x.name.toLowerCase().startsWith(q)) || placed.find(x => x.name.toLowerCase().includes(q));
  if (!n) return;
  if (n.type === 'Agency' && !S.ag){ S.ag = true; document.getElementById('agToggle').checked = true; }
  if (S.lens === 'reach' || (S.lens === 'overlap' && !(isPromo(n) || n.type === 'Venue'))) S.lens = 'network';
  S.sel = n.id; render(); zoomTo(n); }
const qEl = document.getElementById('q');
qEl.addEventListener('change', () => findNode(qEl.value));
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') findNode(qEl.value); });
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render(); fit(); if (S.sel) zoomTo(byId.get(S.sel));
window.addEventListener('resize', fit);
</script>
</body>
</html>
